<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Meu Treino</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}h1{font-size:24px;margin:0 0 4px}.sub{opacity:.75;font-size:13px}
main{max-width:700px;margin:auto;padding:16px 14px 95px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:11px;border:0;border-radius:12px;background:#e5e7eb;font-weight:700}.tab.active{background:#111827;color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.title{font-size:17px;font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:3px}
.row{display:grid;grid-template-columns:36px 1fr 1fr;gap:7px;align-items:center;margin-top:10px}.row input{width:100%;padding:11px 7px;border:1px solid var(--line);border-radius:10px;font-size:16px}.series{font-weight:700;text-align:center}
.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800;background:#111827;color:#fff}.btn.secondary{background:#e5e7eb;color:#111827}
.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}.section-title{font-size:20px;font-weight:900;margin:8px 0 12px}.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}small{color:var(--muted)}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}footer button{flex:1}
.setting{display:block;width:100%;text-align:left;margin:8px 0;padding:15px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:700}
</style></head><body>
<header><h1>🏋️ Meu Treino</h1><div class="sub">V1.1 · Registro e progressão de cargas</div></header>
<main><div class="tabs" id="topTabs">
<button class="tab active" onclick="showTab('treino',this)">Treino</button><button class="tab" onclick="showTab('historico',this)">Histórico</button><button class="tab" onclick="showTab('evolucao',this)">Evolução</button><button class="tab" onclick="showTab('config',this)">⚙️</button>
</div><div id="app"></div></main>
<footer><button class="btn secondary" onclick="clearForm()">Limpar campos</button><button class="btn" onclick="saveToday()">💾 Salvar treino</button></footer>
<script>
const workouts={
A:{name:"Quadríceps e Ombro",ex:[["Cadeira adutora",3,10],["Agachamento livre",3,10],["Cadeira extensora",3,10],["Desenvolvimento máquina/halter",3,10],["Elevação lateral",3,10]]},
B:{name:"Superiores",ex:[["Puxada alta aberta",3,10],["Remada máquina",3,10],["Rosca direta polia",3,10],["Tríceps na polia",3,10],["Abdômen supra",3,25],["Panturrilha em pé",3,10]]},
C:{name:"",ex:[["Cadeira abdutora",3,10],["Mesa flexora",3,10],["Elevação de quadril",3,10],["Supino reto máquina",3,10],["Voador",3,10],["Prancha isométrica",3,30]]}};
let current="A",tab="treino",data=JSON.parse(localStorage.getItem("meuTreino")||"[]");
function lastFor(ex){let r=data.filter(x=>x.exercise===ex);return r.length?r[r.length-1]:null}
function render(){
 const app=document.getElementById("app");document.querySelector("footer").style.display=tab==="treino"?"flex":"none";
 if(tab==="historico"){renderHistory(app);return}if(tab==="evolucao"){renderEvolution(app);return}if(tab==="config"){renderConfig(app);return}
 const w=workouts[current];let h=`<div class="tabs"><button class="tab ${current==="A"?"active":""}" onclick="current='A';render()">A</button><button class="tab ${current==="B"?"active":""}" onclick="current='B';render()">B</button><button class="tab ${current==="C"?"active":""}" onclick="current='C';render()">C</button></div><div class="section-title">Treino ${current}${w.name?" — "+w.name:""}</div>`;
 w.ex.forEach((e,i)=>{let last=lastFor(e[0]);h+=`<div class="card"><div class="title">${e[0]}</div><div class="meta">Meta: ${e[1]} × ${e[2]}${last?" · Último: "+last.sets.map(s=>s.weight+"kg × "+s.reps).join(" / "):""}</div>`;
 for(let s=0;s<e[1];s++)h+=`<div class="row"><div class="series">${s+1}</div><input inputmode="decimal" placeholder="kg" data-ex="${i}" data-s="${s}" data-k="weight"><input inputmode="numeric" placeholder="${e[0].toLowerCase().includes("prancha")?"segundos":"reps"}" data-ex="${i}" data-s="${s}" data-k="reps"></div>`;
 h+=`<div class="actions"><button class="btn secondary" onclick="copyLast(${i})">↻ Último</button></div></div>`});app.innerHTML=h}
function collect(){let o={};document.querySelectorAll("[data-ex]").forEach(el=>{let i=el.dataset.ex,s=el.dataset.s,k=el.dataset.k;o[i]??=[];o[i][s]??={weight:"",reps:""};o[i][s][k]=el.value});return o}
function saveToday(){let sets=collect(),date=new Date().toISOString().slice(0,10),count=0;Object.entries(sets).forEach(([i,arr])=>arr.forEach(s=>{if(s.weight||s.reps){data.push({date,workout:current,exercise:workouts[current].ex[i][0],sets:[s]});count++}}));localStorage.setItem("meuTreino",JSON.stringify(data));alert(count?"Treino salvo!":"Preencha pelo menos uma série.");if(count)render()}
function clearForm(){document.querySelectorAll("[data-ex]").forEach(x=>x.value="")}
function copyLast(i){let last=lastFor(workouts[current].ex[i][0]);if(!last)return alert("Ainda não há histórico deste exercício.");last.sets.forEach((s,n)=>{let w=document.querySelector(`[data-ex="${i}"][data-s="${n}"][data-k="weight"]`),r=document.querySelector(`[data-ex="${i}"][data-s="${n}"][data-k="reps"]`);if(w)w.value=s.weight;if(r)r.value=s.reps})}
function renderHistory(app){if(!data.length){app.innerHTML='<div class="empty">Nenhum treino salvo ainda.</div>';return}let g={};data.forEach(x=>(g[x.date]??=[]).push(x));app.innerHTML=Object.entries(g).reverse().map(([d,r])=>`<div class="card"><div class="title">${new Date(d+"T12:00:00").toLocaleDateString("pt-BR")}</div>${r.map(x=>`<div class="stat"><span>${x.exercise}</span><small>${x.sets[0].weight||"-"} kg × ${x.sets[0].reps}</small></div>`).join("")}</div>`).join("")}
function renderEvolution(app){let by={};data.forEach(x=>{let w=Number(x.sets[0].weight)||0;by[x.exercise]??=[];by[x.exercise].push({date:x.date,w,r:x.sets[0].reps})});let h='<div class="section-title">Evolução</div>';if(!Object.keys(by).length)h+='<div class="empty">Registre alguns treinos para ver sua evolução.</div>';else Object.entries(by).forEach(([e,a])=>{let m=Math.max(...a.map(x=>x.w));h+=`<div class="card"><div class="title">${e}</div><div class="stat"><span>Maior carga</span><b>${m} kg</b></div><div class="stat"><span>Último registro</span><small>${a[a.length-1].w} kg × ${a[a.length-1].r}</small></div></div>`});app.innerHTML=h}
function renderConfig(app){app.innerHTML=`<div class="section-title">⚙️ Configurações</div><div class="card"><div class="title">Dados do aplicativo</div><div class="meta">${data.length} registros salvos neste dispositivo.</div><button class="setting" onclick="deleteHistory()">🗑️ Apagar histórico de treinos</button><button class="setting" onclick="deleteAll()">⚠️ Apagar todos os dados</button></div><div class="card"><div class="title">V1.1</div><div class="meta">Os dados ficam armazenados localmente neste dispositivo.</div></div>`}
function deleteHistory(){if(!data.length)return alert("Não há histórico para apagar.");if(confirm("Apagar todo o histórico de treinos? Esta ação não pode ser desfeita.")){data=[];localStorage.removeItem("meuTreino");alert("Histórico apagado.");render()}}
function deleteAll(){if(confirm("ATENÇÃO: apagar TODOS os dados do aplicativo? Esta ação não pode ser desfeita.")){localStorage.clear();data=[];alert("Todos os dados foram apagados.");render()}}
function showTab(t,b){tab=t;document.querySelectorAll("#topTabs .tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}render();
</script></body></html>
